name: 一键部署到Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '👉 你的网站ZIP包下载地址'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CF_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
      CF_PROJECT: ${{ secrets.CF_PROJECT }}

    steps:
      - name: 1️⃣ 下载 ZIP 包
        run: |
          curl -f -L -o website.zip "${{ inputs.zip_url }}"
          mkdir -p build
          unzip -q website.zip -d build

      - name: 2️⃣ 部署到 Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          # 👇 1. 推荐方式：直接使用内置的 projectName 参数
          projectName: ${{ env.CF_PROJECT }}
          # 👇 2. 修改后的命令：只保留目录和分支，去掉了会报错的 --project-name
          command: pages deploy build --branch=main
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

      - name: ✅ 部署成功
        run: |
          echo "🎉 部署完成！"
          echo "访问地址：https://${{ env.CF_PROJECT }}.pages.dev"